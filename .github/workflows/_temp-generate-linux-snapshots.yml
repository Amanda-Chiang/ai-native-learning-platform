name: TEMP generate Linux visual snapshots

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Generate visual snapshots
        run: npx playwright test tests/visual --update-snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-snapshots
          path: tests/visual/**/*-snapshots/*-linux.png
          retention-days: 3

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshot-playwright-report
          path: playwright-report/
          retention-days: 3
