name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E / visual regression
        run: npm run test:e2e
        env:
          # tests/e2e/global-setup.ts provisions a real throwaway user via
          # the service-role client, and Playwright's webServer (npm run
          # dev) needs the same values Next.js reads from .env.local
          # locally -- neither exists in a fresh CI checkout, so these
          # must come from real repository secrets (Settings > Secrets and
          # variables > Actions). NEXT_PUBLIC_SUPABASE_URL/ANON_KEY are
          # Supabase's own publishable values; SUPABASE_SERVICE_ROLE_KEY is
          # sensitive and must never be logged or echoed.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # tests/e2e/tutor-agent.spec.ts is the one suite that calls a
          # real model (gpt-4.1) -- every other spec never reaches
          # sendTutorMessage, so this has no effect on them.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
