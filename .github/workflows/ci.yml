name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint/typecheck/build stay on Linux deliberately: that is what the
  # deployment target runs, so a build failure here is a build failure
  # there. Nothing in this job compares pixels, so the renderer is
  # irrelevant to it.
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Playwright runs on macOS, and that is the whole point: visual
  # baselines are platform-suffixed because a browser delegates glyph
  # rasterization to the operating system (CoreText on macOS, FreeType
  # on Linux) and lets the OS draw native form controls. Identical CSS
  # therefore produces slightly different pixels per platform -- which
  # matters to nobody in production, since a user only ever sees one
  # platform, but breaks an image comparison run across two.
  #
  # Baselines are generated on macOS during development
  # (`--update-snapshots=all`), so comparing them on macOS makes the
  # committed images the single source of truth. Keeping a second,
  # Linux set meant every visual change needed a one-off workflow
  # temporarily committed to `main` just to regenerate them on a
  # matching runner -- seven such cycles in this repo's history, which
  # caught zero real bugs. Runner minutes are free here because the
  # repository is public, so the only thing that trade was buying was
  # the ritual.
  #
  # The typeface itself is NOT a cross-platform variable: the app
  # self-hosts Geist via next/font (src/app/layout.tsx), so the font is
  # identical everywhere. Only rasterization and native widget chrome
  # differ.
  e2e-visual:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      # No `--with-deps` here: that flag installs Linux system packages
      # and is not applicable on a macOS runner.
      - name: Install Playwright browsers
        run: npx playwright install chromium webkit

      - name: E2E / visual regression
        run: npm run test:e2e
        env:
          # tests/e2e/global-setup.ts provisions a real throwaway user via
          # the service-role client, and Playwright's webServer (npm run
          # dev) needs the same values Next.js reads from .env.local
          # locally -- neither exists in a fresh CI checkout, so these
          # must come from real repository secrets (Settings > Secrets and
          # variables > Actions). NEXT_PUBLIC_SUPABASE_URL/ANON_KEY are
          # Supabase's own publishable values; SUPABASE_SERVICE_ROLE_KEY is
          # sensitive and must never be logged or echoed.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # tests/e2e/tutor-agent.spec.ts is the one suite that calls a
          # real model (gpt-4.1) -- every other spec never reaches
          # sendTutorMessage, so this has no effect on them.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
